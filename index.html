<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Johnny Tec - AI Assistant</title>
    
    <!-- Strict Isolation: Every component has its own file -->
    <link rel="stylesheet" href="Css/variables.css">
    <link rel="stylesheet" href="Css/main.css">
    <link rel="stylesheet" href="Css/sidebar.css">
    <link rel="stylesheet" href="Css/chat-cards.css">
</head>
<body>

    <!-- Mobile Menu Button (Only shows on phones) -->
    <button id="mobile-menu-btn" class="menu-toggle">☰</button>

    <!-- LEFT: The Isolated Sidebar -->
    <nav id="left-sidebar" class="sidebar">
        <div class="brand">
            <h2><span style="color: var(--accent-blue);">Johnny</span> <span style="color: var(--accent-purple);">Tec</span>.Dev</h2>
            <p>Building Digital Excellence</p>
        </div>

        <button id="btn-new-chat" class="btn-primary">+ New Chat</button>

        <ul class="sidebar-menu">
            <li class="menu-item active"><span class="icon">💬</span> AI Chat</li>
            <li class="menu-item"><span class="icon">🖼️</span> Image Generator</li>
            <li class="menu-item"><span class="icon">🎙️</span> Voice Assistant</li>
            <li class="menu-item"><span class="icon">🕒</span> History</li>
        </ul>
    </nav>

    <!-- CENTER: The Isolated Main Screen -->
    <main id="main-content">
        <header>
            <h1>Hey <span class="text-gradient">Johnny,</span></h1>
            <p class="subtitle">How can I help you today?</p>
        </header>

        <!-- The Isolated Chat Cards -->
        <section id="feature-grid" class="grid-container">
            <div class="chat-card">
                <div class="card-icon">&lt;/&gt;</div>
                <h3>Code</h3>
                <p>Generate code</p>
            </div>
            <div class="chat-card">
                <div class="card-icon">≡</div>
                <h3>Explain</h3>
                <p>Explain anything</p>
            </div>
            <div class="chat-card">
                <div class="card-icon">✎</div>
                <h3>Create</h3>
                <p>Create content</p>
            </div>
            <div class="chat-card">
                <div class="card-icon">⟡</div>
                <h3>Solve</h3>
                <p>Solve problems</p>
            </div>
        </section>
    </main>

    <!-- Modular JS connected here -->
    <script type="module" src="js/app.js"></script>
</body>
</html>

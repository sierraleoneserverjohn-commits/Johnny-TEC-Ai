<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Workspace</title>
    
    <!-- Isolated CSS Modules -->
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/sidebar.css">
    <link rel="stylesheet" href="styles/main-screen.css">
    <link rel="stylesheet" href="styles/profile-panel.css">
</head>
<body>

    <div class="app-container">
        <!-- Settings & Navigation Sidebar -->
        <aside id="sidebar" class="sidebar">
            <nav>
                <button id="btn-chat">Chat</button>
                <button id="btn-image-gen">Image Generator</button>
                <button id="btn-voice">Voice Assistant</button>
            </nav>
            <div id="api-settings" class="settings-panel">
                <!-- API inputs handled by sidebar.js -->
            </div>
        </aside>

        <!-- Main Workspace -->
        <main id="main-screen" class="main-screen">
            <!-- Dynamic content injected here -->
        </main>

        <!-- Profile Panel -->
        <aside id="profile-panel" class="profile-panel">
            <!-- Profile logic handled by profile.js -->
        </aside>
    </div>

    <!-- Isolated JavaScript Modules -->
    <script type="module" src="js/sidebar.js"></script>
    <script type="module" src="js/main-screen.js"></script>
    <script type="module" src="js/profile-panel.js"></script>
</body>
</html>
